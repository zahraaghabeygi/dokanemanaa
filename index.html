<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>دکان معنا</title>

  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;500;700&display=swap" rel="stylesheet">

  <style>

    body{
      margin:0;
      font-family:'Vazirmatn', sans-serif;
      background:#f5efe6;
      color:#3d2c1e;
      text-align:center;
    }

    header{
      background:linear-gradient(to left,#4e2f1f,#8b5e34);
      padding:50px 20px;
      color:white;
    }

    .logo{
      width:260px;
      max-width:90%;
      margin-bottom:20px;
      filter:drop-shadow(0 6px 12px rgba(0,0,0,0.3));
    }

    h1{
      font-size:48px;
      margin:10px 0;
    }

    .subtitle{
      font-size:20px;
      opacity:0.9;
    }

    .container{
      width:90%;
      max-width:800px;
      margin:50px auto;
    }

    .episode{
      background:white;
      border-radius:24px;
      padding:40px;
      box-shadow:0 8px 25px rgba(0,0,0,0.1);
    }

    .episode h2{
      color:#8b5e34;
      font-size:34px;
    }

    .quote{
      font-size:24px;
      line-height:2.2;
      margin:30px 0;
      color:#5a4634;
    }

    .listen-btn{
      display:inline-block;
      background:#8b5e34;
      color:white;
      padding:16px 35px;
      border-radius:14px;
      text-decoration:none;
      font-size:18px;
      transition:0.3s;
    }

    .listen-btn:hover{
      background:#6f4726;
      transform:scale(1.05);
    }

    footer{
      margin-top:50px;
      padding:20px;
      color:#7a6a5c;
    }

  </style>
</head>

<body>

  <header>

    <img src="logo.jpg" class="logo">

    <h1>دکان معنا</h1>

    <p class="subtitle">
          ما اینجا داستان هایی از مولانا که برامون جالب و آموزنده بودند رو تعریف میکنیم
    </p>

  </header>

  <div class="container">

    <div class="episode">

      <h2>اپیزود 7</h2>

      <p class="quote">
        تو مکانی اصل تو در لامکان<br>
        این دکان بربند و بگشا آن دکان
      </p>

      <a class="listen-btn"
      href="https://drive.google.com/file/d/1jw--3ZGhYb0dCi79xo4gNRi6wsiZ-OY6/view?usp=drive_link">

        🎧 شنیدن اپیزود

      </a>

    </div>

  </div>

  <footer>
    
  
  </footer>

</body>

</html>
